# RxGuard-RAG production stack. Runbook: docs/PRODUCTION.md
#
#   cp .env.example .env   # set POSTGRES_PASSWORD, JWT_SECRET_KEY, DOMAIN, GEMINI_API_KEY
#   docker compose -f deployment/docker-compose.prod.yml --env-file .env up -d --build
#
# postgres (healthy) -> bootstrap (migrate, seed, labels, rules; one-shot) -> api -> caddy (HTTPS)
# Only Caddy publishes ports; PostgreSQL and the API are reachable only inside this network.

name: rxguard-prod

x-app: &app
  build:
    context: ..
  environment: &app_env
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rxguard_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rxguard_db}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
    MODEL_MODE: ${MODEL_MODE:-real}
    LLM_BACKEND: ${LLM_BACKEND:-gemini}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    GEMINI_DAILY_BUDGET: ${GEMINI_DAILY_BUDGET:-500}
    INCLUDE_DDINTER: ${INCLUDE_DDINTER:-true}
    CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    RXGUARD_GENERATED_RULES_DIR: /app/generated

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rxguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rxguard_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bootstrap:
    <<: *app
    environment:
      <<: *app_env
      LIMIT: ${LIMIT:-500}
    command: ["python", "-m", "src.rxguard.ops.bootstrap"]
    volumes:
      - generated:/app/generated
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app_env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    expose:
      - "8000"
    volumes:
      - generated:/app/generated:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-rxguard_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-rxguard_db}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    # A compressed dump every 24 h; the newest BACKUP_KEEP dumps are kept. Restore: docs/PRODUCTION.md
    entrypoint: ["sh", "-c"]
    command:
      - >
        while true; do
          pg_dump --format=custom --file=/backups/rxguard-$$(date +%Y%m%d-%H%M%S).dump &&
          ls -1t /backups/rxguard-*.dump | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f;
          sleep 86400;
        done
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  generated:
  caddy_data:
  caddy_config:
  backups:
