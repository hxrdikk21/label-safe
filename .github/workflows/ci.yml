name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy (strict)
        run: mypy src/rxguard

      # Integration tests start PostgreSQL via testcontainers on the runner's Docker.
      - name: Pytest
        run: pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Light image (offline model doubles): proves the Dockerfile builds and the app boots.
      - name: Build
        run: docker build --build-arg EXTRAS="" -t rxguard:ci .
      - name: Smoke test
        run: |
          docker run -d --name rxguard -p 8000:8000 \
            -e MODEL_MODE=fake -e LLM_BACKEND=template -e DATABASE_URL= \
            -e JWT_SECRET_KEY=ci-only-secret-key-at-least-32-characters-long rxguard:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/v1/ready
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8000/ | grep -q 200
          docker logs rxguard | tail -20
