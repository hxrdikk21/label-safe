[project]
name = "labelsafe"
version = "2.0.0"
description = "Evidence-grounded medication safety intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "defusedxml>=0.7.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "google-genai>=2.33",
]

[project.optional-dependencies]
# Real models for MODEL_MODE=real (local only: too large for Vercel); tests, CI and Vercel run MODEL_MODE=fake.
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-defusedxml>=0.7",
    "asyncpg-stubs>=0.29",
    "testcontainers[postgres]>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Code imports as ``src.labelsafe...`` (namespace package rooted at the repo).
[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src/labelsafe"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Docs are hand-written; keep ruff to Python sources.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
# UP042: shared contract enums stay (str, Enum); StrEnum changes str()/format() output.
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# FastAPI's dependency-injection idiom: Depends()/Query() in argument defaults.
"src/labelsafe/api/**" = ["B008"]
# The system prompt is kept verbatim; wrapping it would change what the model sees.
"src/labelsafe/chatbot/prompt_manager.py" = ["E501"]
# Embedded web asset (HTML/CSS/JS) for the Evidence Navigator page.
"src/labelsafe/evidence/navigator_page.py" = ["E501"]
# Embedded HTML email template.
"src/labelsafe/auth/email_service.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]

# Optional model backends are imported lazily and may be absent.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true
